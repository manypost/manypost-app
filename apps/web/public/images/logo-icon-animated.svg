<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">manypost animated icon</title>
  <desc id="desc">Ícone da manypost com fundo roxo estático e símbolo branco em rotação.</desc>

  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="48%" stop-color="#8B3CF0"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <style>
      .symbol {
        transform-origin: 128px 128px;
        animation: spin 1.2s linear infinite;
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .symbol {
          animation: none;
        }
      }
    </style>
  </defs>

  <!-- Fundo roxo fixo — só o símbolo gira -->
  <rect x="20" y="20" width="216" height="216" rx="46" fill="url(#bgGradient)"/>

  <path
    class="symbol"
    d="M128 36 C128 87 169 128 220 128 C169 128 128 169 128 220 C128 169 87 128 36 128 C87 128 128 87 128 36 Z"
    fill="#FFFFFF"
  />
</svg>
